<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">후보 B — 물때 안 생기는 칫솔꽂이: 짧은 변 단면 + 윗면 (3 px = 1 mm) · 치수 20-디자인.md, 무게 21-구현원가</text>
  <text x="20" y="46" fill="#666">구멍·경사·자석·흡수체·전원 0. 세라믹 트레이가 베이스, 와이어 프레임이 칫솔을 띄움.</text>

  <!-- side section: tray 80 deep x 14 tall; inner 68 x 6 -->
  <g transform="translate(120,120)">
    <!-- counter -->
    <rect x="-60" y="396" width="440" height="14" fill="#efe9e1" stroke="#b5a999"/>
    <text x="-55" y="425" fill="#8a7d6b">세면대 카운터</text>
    <!-- feet: 12 dia x 6 tall -> 36 x 18 -->
    <rect x="24" y="378" width="36" height="18" rx="6" fill="#bdbdbd" stroke="#555"/>
    <rect x="180" y="378" width="36" height="18" rx="6" fill="#bdbdbd" stroke="#555"/>
    <text x="226" y="392" fill="#555" font-size="11">실리콘 발 Ø12×6 ×4 (끼움), 공기층 6</text>
    <!-- tray outer 80 x 14 -> 240 x 42 ; top at y=336 -->
    <path d="M0 378 L0 336 L240 336 L240 378 Z" fill="#f4f4f1" stroke="#333" stroke-width="1.5"/>
    <!-- inner dish 68 wide x 6 deep -> 204 x 18 ; walls 6 -> 18 ; floor 8 -> 24 -->
    <path d="M18 336 L18 354 Q18 360 24 360 L216 360 Q222 360 222 354 L222 336" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <!-- water film 1-2 mm -> 3-6 px -->
    <rect x="30" y="355" width="180" height="5" fill="#9fd3f0" opacity="0.9"/>
    <text x="180" y="-12" fill="#1f6feb" font-size="11">물막 1~2 mm (목표치, 미확인)</text>
    <text x="180" y="2" fill="#1f6feb" font-size="11">12 h 내 건조는 환기 조건에서만 성립</text>
    <text x="180" y="16" fill="#333" font-size="11">트레이 바닥 8, 벽 5~6, 안쪽 R6, 평탄 ±0.5~1</text>
    <!-- wire legs: dia 5 -> 15px wide, rise 95 -> 285 from tray floor (y=360) up to y=75 -->
    <rect x="6" y="75" width="12" height="261" fill="#9aa0a6" stroke="#444"/>
    <rect x="222" y="75" width="12" height="261" fill="#9aa0a6" stroke="#444"/>
    <!-- top frame -->
    <rect x="6" y="63" width="228" height="12" rx="6" fill="#9aa0a6" stroke="#444"/>
    <!-- keyhole ring in section: ring at centre, width 32 -> 96 -->
    <rect x="72" y="63" width="12" height="12" fill="#7a8187"/>
    <rect x="156" y="63" width="12" height="12" fill="#7a8187"/>
    <text x="246" y="72" fill="#333" font-size="11">열쇠구멍 링, 바닥에서 95</text>
    <!-- 3-point rib at 10 mm above floor -> y = 360-30 = 330 -->
    <rect x="84" y="326" width="72" height="6" fill="#7a8187"/>
    <rect x="114" y="332" width="12" height="4" fill="#7a8187"/>
    <text x="246" y="333" fill="#333" font-size="11">3점 리브: 바닥에서 10 띄움</text>
    <!-- electric toothbrush: handle dia 28 -> 84, stands on rib, truncated above -->
    <rect x="78" y="-10" width="84" height="336" rx="30" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="104" y="-60" width="32" height="60" rx="6" fill="#dfe3e6" stroke="#333"/>
    <text x="180" y="-40" fill="#333" font-size="11">전동칫솔 손잡이 Ø20~31 (실측 필요), 130~150 g</text>
    <text x="180" y="-26" fill="#333" font-size="11">모는 위(정립) — 거꾸로 걸기 특허군 회피</text>
    <!-- dimensions -->
    <g stroke="#1f6feb" fill="#1f6feb">
      <line x1="0" y1="430" x2="240" y2="430"/>
      <line x1="0" y1="424" x2="0" y2="436"/>
      <line x1="240" y1="424" x2="240" y2="436"/>
      <text x="108" y="446" font-size="11">80 (폭 120)</text>
      <line x1="-30" y1="63" x2="-30" y2="396"/>
      <line x1="-36" y1="63" x2="-24" y2="63"/>
      <line x1="-36" y1="396" x2="-24" y2="396"/>
      <text x="-56" y="235" font-size="11">110</text>
      <line x1="262" y1="75" x2="262" y2="360" stroke-dasharray="3 3"/>
      <text x="268" y="220" font-size="11">95</text>
    </g>
  </g>

  <!-- top view -->
  <g transform="translate(560,110)">
    <text x="0" y="0" font-weight="bold">윗면 (3 px = 1 mm)</text>
    <!-- tray 120 x 80 -> 360 x 240 -->
    <rect x="0" y="10" width="360" height="240" rx="12" fill="#f4f4f1" stroke="#333" stroke-width="1.5"/>
    <rect x="18" y="28" width="324" height="204" rx="18" fill="#ffffff" stroke="#333"/>
    <!-- wire frame outline -->
    <rect x="12" y="22" width="336" height="216" rx="8" fill="none" stroke="#9aa0a6" stroke-width="6"/>
    <!-- keyholes: centres 48 apart -> 144 px; centre of tray (180,130); circle dia 32 -> r 48; slot 14x18 -> 42 x 54 outward -->
    <g fill="#ffffff" stroke="#444" stroke-width="2">
      <circle cx="108" cy="130" r="48"/>
      <rect x="45" y="109" width="63" height="42"/>
      <circle cx="252" cy="130" r="48"/>
      <rect x="252" y="109" width="63" height="42"/>
    </g>
    <g fill="#9aa0a6" stroke="#444" stroke-width="2">
      <circle cx="108" cy="130" r="48" fill="none" stroke-width="6"/>
      <circle cx="252" cy="130" r="48" fill="none" stroke-width="6"/>
    </g>
    <!-- toothbrush heads indication -->
    <circle cx="108" cy="130" r="42" fill="#dfe3e6" opacity="0.7"/>
    <rect x="60" y="118" width="20" height="24" fill="#dfe3e6" opacity="0.9"/>
    <g stroke="#1f6feb" fill="#1f6feb">
      <line x1="108" y1="200" x2="252" y2="200"/>
      <line x1="108" y1="194" x2="108" y2="206"/>
      <line x1="252" y1="194" x2="252" y2="206"/>
      <text x="165" y="216" font-size="11">48 (모 간격 ≥25)</text>
    </g>
    <text x="0" y="275" fill="#333" font-size="11">Ø32 원: 전동 손잡이 / 14×18 슬롯(바깥 방향): 수동 칫솔 → 모가 바깥을 봄</text>
    <text x="0" y="291" fill="#333" font-size="11">두 슬롯 같은 모양 → 전동 2개도 가능. 3~4인 확장은 다음 버전</text>
  </g>

  <!-- notes -->
  <g transform="translate(560,430)">
    <rect x="0" y="0" width="400" height="150" fill="#fafafa" stroke="#999"/>
    <text x="10" y="20" font-weight="bold">무게·안정성 (21-구현원가 재계산, 담당 계산)</text>
    <text x="10" y="42" font-size="11">세라믹 트레이 ≈215 g + SUS304 Ø5 와이어(전장 ≈1.45 m) ≈220 g = ≈450 g</text>
    <text x="10" y="60" font-size="11">빈 제품 무게중심 ≈35 mm (디자인 ≤20은 과소) → 전동 2개 꽂고 전도각 39~42°</text>
    <text x="10" y="78" font-size="11">15° 기울임 복원·상단 수평 1 N 전도 없음 — 시제품 실측 전</text>
    <text x="10" y="102" font-weight="bold" fill="#c0392b">가장 큰 위험</text>
    <text x="10" y="120" font-size="11" fill="#c0392b">RH 85~90% 욕실에서 물막 건조 12~35시간 → "12시간 내 건조" 미성립 가능</text>
    <text x="10" y="138" font-size="11" fill="#c0392b">발 1개 빠지면 유약(모스 6~7)이 아크릴·인조대리석 세면대를 긁음</text>
  </g>

  <text x="20" y="600" fill="#666">법적 판단 아님. 미세 홈 사양은 1차 제외(유약이 메움 + 조준서·케이비엠 청구항 대조 필요). 석고형 발주 전 기성 접시 실측 4항목.</text>
</svg>
