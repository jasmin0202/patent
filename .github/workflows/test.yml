name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 출처확인·완료확인 도구 테스트 (표준 라이브러리만, 네트워크 없음)
        run: python -I -m unittest discover -s tests -v
      - name: 예시 실행 폴더가 운영 규칙을 지키는지 검사 (산출물·상한·등급)
        run: python -I tools/완료확인.py examples/2026-10-23-bathroom
      - name: 문법·설정 파일 검사
        run: |
          python -I -m py_compile tools/출처확인.py tools/완료확인.py tools/kipris_청구항.py
          python -I -c "import json; json.load(open('.mcp.json', encoding='utf-8'))"
      - name: 비밀값 유출 검사
        run: |
          ! grep -rIn --exclude-dir=.git --exclude-dir=node_modules -E '(ServiceKey|KIPRIS_API_KEY|AccessKey)\s*[:=]\s*"[A-Za-z0-9+/=]{20,}' .
